<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>怪兽砍杀游戏</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="background-layer"></div>
        <div id="ui-overlay">
            <div id="score-board">
                <div class="score-item">
                    <span class="label">得分:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">关卡:</span>
                    <span id="stage" class="value">1</span>
                </div>
                <div class="score-item">
                    <span class="label">目标:</span>
                    <span id="target" class="value">0/50</span>
                </div>
                <div class="score-item">
                    <span class="label">连击:</span>
                    <span id="combo" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">生命值:</span>
                    <span id="lives" class="value">5</span>
                </div>
            </div>
        </div>
        <canvas id="game-canvas"></canvas>
        <video id="camera-feed" autoplay playsinline muted></video>
        <div id="start-screen">
            <h1>怪兽砍杀游戏</h1>
            <p>挥动手臂来砍杀小怪兽！</p>
            <button id="start-btn">开始游戏</button>
        </div>
        <div id="stage-complete-screen" class="hidden">
            <h1>关卡完成！</h1>
            <p>第 <span id="completed-stage">1</span> 关通过</p>
            <p>本关得分: <span id="stage-score">0</span></p>
            <button id="next-stage-btn">进入下一关</button>
        </div>
        <div id="game-complete-screen" class="hidden">
            <h1>🎉 恭喜通关！</h1>
            <p>总得分: <span id="total-score">0</span></p>
            <button id="play-again-btn">再玩一次</button>
        </div>
        <div id="game-over-screen" class="hidden">
            <h1>游戏结束</h1>
            <p>到达第 <span id="reached-stage">1</span> 关</p>
            <p>最终得分: <span id="final-score">0</span></p>
            <button id="restart-btn">重新开始</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="game.js"></script>
</body>
</html>
